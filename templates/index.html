<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LJN NOC WiFi Collector</title>
<style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#18202a}.wrap{max-width:1100px;margin:30px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 3px 15px #0001}textarea{width:100%;height:180px;box-sizing:border-box;padding:12px;border:1px solid #ccd3da;border-radius:8px}button{padding:11px 18px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.primary{background:#1769e0;color:white}.download{background:#e9eef5;margin-left:8px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#f8fafc}.stats{display:flex;gap:18px;flex-wrap:wrap}.stat{padding:12px 18px;background:#f8fafc;border-radius:10px}.ok{color:#087f3f}.bad{color:#b42318}.small{color:#667085;font-size:13px}</style></head>
<body><div class="wrap"><h1>LJN NOC WiFi Collector</h1><div class="card"><p>Upload <b>ips.txt</b> — satu IP modem per baris. Versi ini hanya menerima IP private/loopback/link-local secara default.</p><textarea id="ips" placeholder="10.10.1.1\n10.10.1.2\n10.10.1.3"></textarea><br><br><input type="file" id="file" accept=".txt,.csv"><br><br><button class="primary" onclick="start()">START COLLECTING</button><button class="download" onclick="location='/export.csv'">DOWNLOAD CSV</button><p id="msg" class="small"></p></div>
<div class="card"><div class="stats"><div class="stat">Total <b id="total">0</b></div><div class="stat ok">Success <b id="success">0</b></div><div class="stat bad">Failed <b id="failed">0</b></div></div></div>
<div class="card"><div style="overflow:auto"><table><thead><tr><th>IP</th><th>Status</th><th>Login</th><th>Model</th><th>SSID</th><th>WiFi Password</th><th>PPPoE Username</th><th>Note</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>const q=s=>document.querySelector(s);q('#file').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>q('#ips').value=t)};async function start(){const text=q('#ips').value.trim();if(!text)return alert('Masukkan atau upload daftar IP');const f=new File([text],'ips.txt',{type:'text/plain'});const fd=new FormData();fd.append('file',f);q('#msg').textContent='Collecting...';q('#rows').innerHTML='';try{const r=await fetch('/collect',{method:'POST',body:fd});const d=await r.json();q('#total').textContent=d.total;q('#success').textContent=d.success;q('#failed').textContent=d.failed;d.results.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(x.ip)}</td><td class="${x.status==='OK'?'ok':'bad'}">${esc(x.status)}</td><td>${esc(x.login)}</td><td>${esc(x.model)}</td><td>${esc(x.ssid)}</td><td>${esc(x.wifi_password)}</td><td>${esc(x.pppoe_username)}</td><td>${esc(x.note)}</td>`;q('#rows').appendChild(tr)});q('#msg').textContent='Selesai.'}catch(e){q('#msg').textContent='Error: '+e}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
